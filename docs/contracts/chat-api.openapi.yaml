openapi: 3.1.0
info:
  title: saaspa-IA - Chat API (NestJS -> IA)
  version: 0.6.1
  description: >-
    Contrato IMPLEMENTADO v0.6.1. Reconciliado contra saaspa-backend@develop (9fc8b12) el 2026-09-26
    (informe: docs/contracts/f1-e2e-validation.md; la validacion previa del borrador esta en
    docs/contracts/t1.0-backend-validation.md). NestJS es el unico punto de entrada de canales:
    resuelve tenant, identidad y rol, y llama a este servicio.
    Estado en el backend: IMPLEMENTADO. El emisor del turn token es src/modules/internal/turn-token.service.ts
    (ES256/P-256, kid en la cabecera, TTL por defecto 300 s, jti = turnId) y el cliente HTTP es
    src/modules/chat/ia-bot.client.ts: POST {IA_BOT_URL}/api/v1/chat con X-Internal-Api-Key = IA_BOT_API_KEY
    y Authorization: Bearer <turn token>, timeout IA_BOT_TIMEOUT_MS (25000 ms por defecto).
    Mapeo de errores del backend: 400 -> 400, 429 -> 429 (el tope de coste de este servicio llega tal cual al
    widget, H-04 resuelto en saaspa-backend), 501 -> 501, timeout -> 504 y cualquier otra respuesta de este
    servicio (incluidos nuestros 401/403/502) -> 502.
    Autenticacion: cabecera de servicio X-Internal-Api-Key con el valor de IA_BOT_API_KEY
    (NestJS -> IA; clave distinta de INTERNAL_API_KEY, que es IA -> NestJS) mas el turn token
    firmado en Authorization: Bearer.
    Reglas: el tenantId del turno se valida contra el unico tenant permitido por este servicio
    (saaspa.tenant.default, por defecto kamerinos via IA_TENANT_DEFAULT): si no coincide se responde
    403. La identidad real es la del turn token y los campos del cuerpo nunca sustituyen a sus claims.
    Implementado en la Fase 1 (v0.3.0): el servicio contrasta tenantId, conversationId, channel,
    agent e identidad del cuerpo con los claims del turn token y responde 400 si no coinciden
    (regla R1); el agente ADMIN todavia no existe y responde 501.
    v0.4.0: el handoff lo decide el codigo (regla R10): los temas de salud, los reclamos y las
    peticiones explicitas de hablar con una persona devuelven handoff.requested=true con su motivo.
    v0.5.0: reconciliacion con el backend real. `channel` y `agent` del cuerpo son los del turn token
    (WEB_WIDGET/WEB_LOGGED en el chat web anonimo y logueado, CLIENTAS como agente en ambos). El
    backend delega en este servicio el estado del handoff por turno y guarda el estado de la
    conversacion por su lado (decision A-10a).
    v0.6.0: el backend preserva el 429 de este servicio hacia el widget (H-04, ya implementado alli) y el
    tope de coste gana el ambito `origin` con el claim opcional `clientIp` (ADR 0020 de este repo); se
    corrige el timeout real del backend (25000 ms).
servers:
  - url: http://localhost:8000
paths:
  /api/v1/chat:
    post:
      operationId: chat
      summary: Procesa un turno conversacional
      security:
        - serviceApiKey: []
          turnToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Respuesta del agente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          description: >-
            Tope de coste superado (ADR 0010 y ADR 0020): turnos o tokens por ventana, por tenant, por
            conversacion o por origen del turno, medidos sobre `ia.turn_log` (sin contador en memoria). El
            `ProblemDetail` incluye `scope` (`tenant`|`conversation`|`origin`), `measure` (`turns`|`tokens`),
            `measured`, `limit` y `window` (ISO-8601). El backend ya preserva este 429 hacia el widget
            (H-04 resuelto en saaspa-backend; antes cualquier respuesta distinta de 400/501 se mapeaba a 502).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: >-
            El agente pedido no esta implementado en esta fase (Fase 1: solo CLIENTAS; el agente
            ADMIN llega en la Fase 3)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: >-
            El backend NestJS no respondio o devolvio un error al ejecutar una herramienta
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: >-
            El modelo no respondio dentro del deadline del turno (`saaspa.llm.turn-deadline`, 20 s por
            defecto; ADR 0014). La escalera end-to-end exige turn-deadline < el timeout con el que NestJS
            llama a este servicio (`IA_BOT_TIMEOUT_MS`, 25 s). El `ProblemDetail` incluye el `turnId` y el
            turno queda registrado en `ia.turn_log` con `status = DEADLINE`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    serviceApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: >-
        Valor de IA_BOT_API_KEY (direccion NestJS -> IA). No confundir con INTERNAL_API_KEY,
        que es el secreto de la direccion IA -> NestJS (/api/internal/v1/*).
    turnToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Turn token ES256 (P-256, cabecera kid) emitido por NestJS (ADR 0006). Implementado en
        saaspa-backend (src/modules/internal/turn-token.service.ts, reconciliado el 2026-09-26):
        iss por defecto saaspa-backend, aud por defecto saaspa-ia, TTL por defecto 300 s y
        jti = turnId. Este servicio solo verifica con la clave publica y acepta dos claves por kid
        para rotar sin cortar el servicio; el backend todavia tiene una unica ranura de kid.
        Claims: jti, tenantId, conversationId, channel, agent, userId?, role? y **clientIp** (H-04, ADR 0020:
        la IP resuelta por el backend con su proxy de confianza —la misma con la que agrupa su Throttler—, que
        es la clave del tope de coste por origen). El backend **ya lo emite** (su PR #84, commit a08985e); sigue
        siendo un claim opcional del token, asi que un turn token sin el es valido y su turno se registra sin
        origen (sin tope por origen, con aviso en el log y `origin_hash IS NULL` en la tabla).
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ChatRequest:
      type: object
      required: [turnId, tenantId, conversationId, channel, agent, identity, message, locale, timezone, now]
      properties:
        turnId: { type: string, format: uuid }
        tenantId: { type: string, example: kamerinos }
        conversationId: { type: string }
        channel:
          type: string
          enum: [WHATSAPP, WEB_WIDGET, WEB_LOGGED, DASHBOARD]
        agent:
          type: string
          enum: [CLIENTAS, ADMIN]
        identity:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [ANONYMOUS, USER] }
            userId: { type: string }
            role: { type: string, enum: [CLIENTE, EMPLEADO, ADMIN] }
        message:
          type: object
          required: [text]
          properties:
            text: { type: string, maxLength: 2000 }
        locale: { type: string, example: es-CO }
        timezone:
          type: string
          example: America/Bogota
          description: >-
            Contexto informativo para el LLM. La autoridad de la zona horaria es saaspa-IA
            (saaspa.tenant.timezone); no se usa para validar fechas ni disponibilidad.
        now:
          type: string
          format: date-time
          description: >-
            Contexto informativo para el LLM. No es la fuente de verdad del reloj de saaspa-IA.
    ChatResponse:
      type: object
      required: [turnId, reply]
      properties:
        turnId: { type: string, format: uuid }
        reply:
          type: object
          required: [text]
          properties:
            text: { type: string }
            links:
              type: array
              items:
                type: object
                required: [label, url]
                properties:
                  label: { type: string }
                  url: { type: string, format: uri }
        handoff:
          type: object
          properties:
            requested: { type: boolean }
            reason:
              type: string
              description: >-
                Motivo cuando requested=true: HEALTH_TOPIC (alergias, embarazo, medicacion, piel,
                reacciones o contraindicaciones), COMPLAINT (reclamo, cobro disputado o devolucion) o
                EXPLICIT_REQUEST (la persona pidio hablar con alguien del equipo)
              enum: [HEALTH_TOPIC, COMPLAINT, EXPLICIT_REQUEST]
        usage:
          type: object
          properties:
            model: { type: string }
            tokensIn: { type: integer }
            tokensOut: { type: integer }
        sources:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              ref: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        turnId:
          type: string
          description: >-
            Solo en el 504 (ADR 0014): identificador del turno, para correlacionar el fallo con NestJS y con
            la fila de `ia.turn_log` (que se registra con `status = DEADLINE`).
