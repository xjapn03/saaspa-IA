openapi: 3.1.0
info:
  title: saaspa-IA - Chat API (NestJS -> IA)
  version: 0.4.0
  description: >-
    Contrato BORRADOR v0.4.0. La v0.2.0 se reviso contra saaspa-backend@develop (ce41e487) en la tarea T1.0
    (informe: docs/contracts/t1.0-backend-validation.md). NestJS sigue siendo el unico punto de
    entrada de canales: resuelve tenant, identidad y rol, y llama a este servicio.
    Estado en el backend: el emisor del turn token NO existe todavia (hoy solo hay JWT de sesion
    HS256 para usuarios) y tampoco existe un cliente HTTP hacia este servicio; es un pedido
    (AGENTS.md seccion 11, pedidos 1 y 3).
    Autenticacion: cabecera de servicio X-Internal-Api-Key con el valor de IA_BOT_API_KEY
    (NestJS -> IA; clave distinta de INTERNAL_API_KEY, que es IA -> NestJS) mas el turn token
    firmado en Authorization: Bearer.
    Reglas: el tenantId del cuerpo se valida contra la lista permitida de este servicio
    (IA_TENANT_DEFAULT); la identidad real es la del turn token y los campos del cuerpo nunca
    sustituyen a sus claims.
    Implementado en la Fase 1 (v0.3.0): el servicio contrasta tenantId, conversationId, channel,
    agent e identidad del cuerpo con los claims del turn token y responde 400 si no coinciden
    (regla R1); el agente ADMIN todavia no existe y responde 501.
    v0.4.0: el handoff lo decide el codigo (regla R10): los temas de salud, los reclamos y las
    peticiones explicitas de hablar con una persona devuelven handoff.requested=true con su motivo.
servers:
  - url: http://localhost:8000
paths:
  /api/v1/chat:
    post:
      operationId: chat
      summary: Procesa un turno conversacional
      security:
        - serviceApiKey: []
          turnToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Respuesta del agente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '501':
          description: >-
            El agente pedido no esta implementado en esta fase (Fase 1: solo CLIENTAS; el agente
            ADMIN llega en la Fase 3)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: >-
            El backend NestJS no respondio o devolvio un error al ejecutar una herramienta
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: >-
            El modelo no respondio dentro del deadline del turno (saaspa.llm.turn-deadline)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    serviceApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: >-
        Valor de IA_BOT_API_KEY (direccion NestJS -> IA). No confundir con INTERNAL_API_KEY,
        que es el secreto de la direccion IA -> NestJS (/api/internal/v1/*).
    turnToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Turn token ES256 (P-256, PEM, cabecera kid) emitido por NestJS (ADR 0006, pedido 1),
        pendiente de implementar en saaspa-backend. Este servicio solo verifica con la clave
        publica y acepta dos claves por kid para rotar sin cortar el servicio.
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ChatRequest:
      type: object
      required: [turnId, tenantId, conversationId, channel, agent, identity, message, locale, timezone, now]
      properties:
        turnId: { type: string, format: uuid }
        tenantId: { type: string, example: kamerinos }
        conversationId: { type: string }
        channel:
          type: string
          enum: [WHATSAPP, WEB_WIDGET, WEB_LOGGED, DASHBOARD]
        agent:
          type: string
          enum: [CLIENTAS, ADMIN]
        identity:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [ANONYMOUS, USER] }
            userId: { type: string }
            role: { type: string, enum: [CLIENTE, EMPLEADO, ADMIN] }
            waId: { type: string }
        message:
          type: object
          required: [text]
          properties:
            text: { type: string, maxLength: 2000 }
        locale: { type: string, example: es-CO }
        timezone: { type: string, example: America/Bogota }
        now: { type: string, format: date-time }
    ChatResponse:
      type: object
      required: [turnId, reply]
      properties:
        turnId: { type: string, format: uuid }
        reply:
          type: object
          required: [text]
          properties:
            text: { type: string }
            links:
              type: array
              items:
                type: object
                required: [label, url]
                properties:
                  label: { type: string }
                  url: { type: string, format: uri }
        handoff:
          type: object
          properties:
            requested: { type: boolean }
            reason:
              type: string
              description: >-
                Motivo cuando requested=true: HEALTH_TOPIC (alergias, embarazo, medicacion, piel,
                reacciones o contraindicaciones), COMPLAINT (reclamo, cobro disputado o devolucion) o
                EXPLICIT_REQUEST (la persona pidio hablar con alguien del equipo)
              enum: [HEALTH_TOPIC, COMPLAINT, EXPLICIT_REQUEST]
        usage:
          type: object
          properties:
            model: { type: string }
            tokensIn: { type: integer }
            tokensOut: { type: integer }
        sources:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              ref: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
