openapi: 3.1.0
info:
  title: saaspa-IA - Chat API (NestJS -> IA)
  version: 0.1.0
  description: >-
    Contrato BORRADOR. NestJS es el unico punto de entrada de canales: resuelve tenant,
    identidad y rol, y llama a este servicio. Pendiente de validar contra el backend real.
    Autenticacion: API key de servicio (transporte) + turn token firmado (identidad, ADR 0006).
servers:
  - url: http://localhost:8000
paths:
  /api/v1/chat:
    post:
      operationId: chat
      summary: Procesa un turno conversacional
      security:
        - serviceApiKey: []
          turnToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Respuesta del agente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    serviceApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
    turnToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ChatRequest:
      type: object
      required: [turnId, tenantId, conversationId, channel, agent, identity, message, locale, timezone, now]
      properties:
        turnId: { type: string, format: uuid }
        tenantId: { type: string, example: kamerinos }
        conversationId: { type: string }
        channel:
          type: string
          enum: [WHATSAPP, WEB_WIDGET, WEB_LOGGED, DASHBOARD]
        agent:
          type: string
          enum: [CLIENTAS, ADMIN]
        identity:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [ANONYMOUS, USER] }
            userId: { type: string }
            role: { type: string, enum: [CLIENTE, EMPLEADO, ADMIN] }
            waId: { type: string }
        message:
          type: object
          required: [text]
          properties:
            text: { type: string }
        locale: { type: string, example: es-CO }
        timezone: { type: string, example: America/Bogota }
        now: { type: string, format: date-time }
    ChatResponse:
      type: object
      required: [turnId, reply]
      properties:
        turnId: { type: string, format: uuid }
        reply:
          type: object
          required: [text]
          properties:
            text: { type: string }
            links:
              type: array
              items:
                type: object
                required: [label, url]
                properties:
                  label: { type: string }
                  url: { type: string, format: uri }
        handoff:
          type: object
          properties:
            requested: { type: boolean }
            reason: { type: string }
        usage:
          type: object
          properties:
            model: { type: string }
            tokensIn: { type: integer }
            tokensOut: { type: integer }
        sources:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              ref: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
