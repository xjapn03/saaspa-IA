openapi: 3.1.0
info:
  title: NestJS Internal API (IA -> NestJS)
  version: 0.3.1
  description: >-
    Contrato v0.3.1 (Fase 1 IMPLEMENTADA). Reconciliado contra saaspa-backend@develop (9fc8b12) el
    2026-09-26 (informe: docs/contracts/f1-e2e-validation.md; la validacion del borrador v0.2.0 esta
    en docs/contracts/t1.0-backend-validation.md). Los endpoints de Fase 1 ya existen en el backend
    (src/modules/internal/); los de Fase 2/3/4 siguen siendo pedidos.
    v0.3.1 (J-07, ADR 0017): el esquema de error pasa a describir lo que el backend responde de verdad
    (el formato por defecto de NestJS, `NestError`), en vez de un ProblemDetail que no implementa.
    Endpoints implementados: GET /api/internal/v1/services (paginado, espejo del catalogo publico),
    GET /api/internal/v1/services/{idOrSlug} (UUID o slug) y GET /api/internal/v1/availability?serviceId&date
    (un dia; devuelve offset explicito y timezone). Los tres van con @SkipThrottle() y
    @UseGuards(InternalAuthGuard).
    Autenticacion: cabecera X-Internal-Api-Key con el valor de INTERNAL_API_KEY (direccion
    IA -> NestJS; secreto distinto de IA_BOT_API_KEY, que es NestJS -> IA) mas el turn token
    (ADR 0006) en Authorization: Bearer. NestJS autoriza con la identidad DEL TOKEN, nunca con
    parametros que envie este servicio ni con argumentos generados por el modelo.
    Respuestas de error reales del guard: 401 si falta o no coincide la clave de servicio o el turn
    token; 403 si el tenantId del token no es el TENANT_ID del backend.
    Pendiente del lado NestJS: auditoria de las llamadas internas (existe AuditService, pero
    src/modules/internal/ no lo usa: el turno solo queda en request.turn), segunda ranura de kid para
    rotar la clave del turn token y los endpoints de Fase 2/3/4.
servers:
  - url: http://backend:3001
security:
  - internalApiKey: []
    turnToken: []
paths:
  /api/internal/v1/services:
    get:
      operationId: listServices
      summary: Catalogo de servicios activos (Fase 1)
      description: >-
        Espeja la semantica real de GET /api/services/public (isActive=true, orden por nombre,
        paginado, price numerico) pero autorizado con el turn token.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: featured
          in: query
          schema: { type: string, enum: ['true', 'false'] }
          description: >-
            Validado como texto (no se coerciona): cualquier otro valor responde 400; es el
            comportamiento real de ListInternalServicesQueryDto.
      responses:
        '200':
          description: Lista paginada de servicios activos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedServices' }
        '400': { description: page/limit/featured invalidos }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/v1/services/{idOrSlug}:
    get:
      operationId: getService
      summary: Detalle de un servicio (Fase 1, implementado)
      description: >-
        Reconciliado con el backend: el parametro de ruta acepta **UUID o slug** (el controlador
        decide con isUuid). En la API real el detalle publico es por slug
        (GET /api/services/public/{slug}); aqui no se filtra por isActive, igual que el endpoint real.
        Responde 404 si el servicio no existe.
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema: { type: string }
          description: UUID del servicio o su slug
      responses:
        '200':
          description: Servicio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/v1/availability:
    get:
      operationId: getAvailability
      summary: Disponibilidad de agenda para un dia (Fase 1, implementado)
      description: >-
        Reconciliado con el backend: equivale a GET /api/bookings/slots?serviceId&date (un solo dia,
        agenda unica global, no hay staffId) pero devuelve instantes con offset explicito y el campo
        timezone. `serviceId` acepta UUID o slug; `date` debe ser una fecha de calendario real
        (YYYY-MM-DD) o responde 400. El offset se calcula con Intl.DateTimeFormat y longOffset, asi
        que NO depende del tzdata del contenedor (resuelve la duda C-02 del informe T1.0).
      parameters:
        - name: serviceId
          in: query
          required: true
          schema: { type: string }
          description: UUID del servicio o su slug
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-10-01'
      responses:
        '200':
          description: Franjas disponibles del dia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { description: date no es una fecha de calendario YYYY-MM-DD valida }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/v1/bookings:
    post:
      operationId: createBooking
      summary: Crea una cita en PENDIENTE_PAGO (Fase 2, escritura)
      description: >-
        Nuevo respecto a la API publica: hoy POST /api/bookings no acepta Idempotency-Key y no
        devuelve deep-link de pago (el pago se inicia con POST /api/payments/init, que entrega la
        configuracion del widget). Pedido 5 de AGENTS.md seccion 11.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCreate' }
      responses:
        '201':
          description: Cita creada + deep-link de pago
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >-
            Slot ocupado, o tope de reservas pendientes por usuario alcanzado
            (`BOOKING_MAX_PENDING_PER_USER`, 2 por defecto; PR #77)
  /api/internal/v1/bookings/{id}:
    patch:
      operationId: rescheduleBooking
      summary: Reprograma una cita (Fase 2, escritura)
      description: >-
        Envuelve el comportamiento real de PATCH /api/bookings/{id}/reschedule (dueno o ADMIN); aqui
        se anade Idempotency-Key.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startTime]
              properties:
                startTime: { type: string, format: date-time }
      responses:
        '200':
          description: Cita reprogramada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '409': { description: Slot ocupado }
    delete:
      operationId: cancelBooking
      summary: Cancela una cita (Fase 2, escritura)
      description: >-
        Envuelve el comportamiento real de PATCH /api/bookings/{id}/cancel (dueno o ADMIN); aqui se
        anade Idempotency-Key.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Cita cancelada }
  /api/internal/v1/me/bookings:
    get:
      operationId: myBookings
      summary: Citas del cliente autenticado (Fase 2)
      description: Hoy equivale a GET /api/bookings cuando el rol es CLIENTE (el controlador filtra por userId).
      responses:
        '200': { description: Citas del cliente }
  /api/internal/v1/reports/sales:
    get:
      operationId: reportSales
      summary: Ventas por periodo (Fase 3, solo ADMIN)
      responses:
        '200': { description: Cifras calculadas por el backend }
  /api/internal/v1/reports/top-services:
    get: { operationId: reportTopServices, summary: Servicios mas solicitados (Fase 3, solo ADMIN), responses: { '200': { description: OK } } }
  /api/internal/v1/reports/top-products:
    get: { operationId: reportTopProducts, summary: Productos mas vendidos (Fase 3, solo ADMIN), responses: { '200': { description: OK } } }
  /api/internal/v1/reports/appointments:
    get: { operationId: reportAppointments, summary: Citas del dia (Fase 3, ADMIN/EMPLEADO), responses: { '200': { description: OK } } }
  /api/internal/v1/reports/low-stock:
    get: { operationId: reportLowStock, summary: Stock bajo (Fase 3, solo ADMIN), responses: { '200': { description: OK } } }
  /api/internal/v1/identity/resolve:
    get:
      operationId: resolveIdentity
      summary: Resuelve identidad por waId/telefono (Fase 4, solo WhatsApp)
      parameters:
        - { name: waId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Identidad resuelta }
components:
  securitySchemes:
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: >-
        Valor de INTERNAL_API_KEY (direccion IA -> NestJS). No confundir con IA_BOT_API_KEY, que es
        el secreto de la direccion NestJS -> IA.
    turnToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Turn token ES256 (P-256, cabecera kid) emitido por NestJS (ADR 0006). IMPLEMENTADO en
        saaspa-backend (src/modules/internal/turn-token.service.ts; reconciliado el 2026-09-26):
        jti = turnId, iss por defecto saaspa-backend, aud por defecto saaspa-ia y TTL por defecto
        300 s (TURN_TOKEN_TTL_SECONDS). NestJS autoriza con la identidad del token, nunca con
        parametros de la peticion. Este servicio reenvia el token tal cual en cada llamada interna.
  responses:
    Unauthorized:
      description: Clave de servicio o turn token ausente, invalido o expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NestError' }
    Forbidden:
      description: >-
        El tenantId del turn token no es el TENANT_ID del backend (ForbiddenException 'Tenant no permitido')
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NestError' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NestError' }
  schemas:
    NestError:
      type: object
      description: >-
        Formato de error REAL del backend: el por defecto de NestJS (no es RFC 9457). `statusCode` es el estado
        HTTP, `message` el texto del error y `error` el nombre corto del estado. El cliente de este servicio
        (BackendClient) mapea este cuerpo a BackendException/BackendUnavailableException y no lo propaga tal
        cual: responde a NestJS con su propio ProblemDetail (RFC 9457, ADR 0017). Nota: los errores de
        saaspa-IA hacia NestJS SI son RFC 9457 (ver chat-api.openapi.yaml).
      properties:
        statusCode: { type: integer }
        message: { type: string }
        error: { type: string }
    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
    Service:
      type: object
      required: [id, name, slug, price, duration, isActive, isFeatured]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        price: { type: number, description: 'COP; el backend convierte el Decimal de Prisma a numero' }
        compareAtPrice: { type: [number, 'null'] }
        duration: { type: integer, description: 'Duracion en minutos' }
        isActive: { type: boolean }
        isFeatured: { type: boolean }
        categoryId: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/Category' }
        imageUrl: { type: [string, 'null'] }
        mainImage: { type: [string, 'null'] }
        carouselImages: { description: 'JSON con la lista de imagenes (puede ser null)' }
    PaginatedServices:
      type: object
      required: [data, total, page, limit, totalPages]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Service' } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }
    Slot:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
          description: 'Instante con offset explicito, p. ej. 2026-10-01T08:00:00-05:00'
          example: '2026-10-01T08:00:00-05:00'
        end: { type: string, format: date-time, example: '2026-10-01T08:50:00-05:00' }
    Availability:
      type: object
      required: [serviceId, date, timezone, slots]
      properties:
        serviceId: { type: string }
        date: { type: string, format: date, example: '2026-10-01' }
        timezone: { type: string, example: America/Bogota }
        slots: { type: array, items: { $ref: '#/components/schemas/Slot' } }
    BookingCreate:
      type: object
      required: [serviceId, startTime]
      properties:
        serviceId: { type: string }
        startTime: { type: string, format: date-time }
        payFull: { type: boolean, description: 'Pagar el total en lugar del abono, si el backend lo soporta' }
    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          description: >-
            IMPLEMENTADO en el backend (PR #77, fusionado el 2026-09-27 01:09 UTC; ADR 0011). Una cita en
            PENDIENTE_PAGO deja de ocupar su franja cuando vence la ventana de pago
            (`BOOKING_PAYMENT_TTL_MINUTES`, 30 min por defecto) y pasa a EXPIRADA: el barrido corre cada
            5 min y una vez al arrancar, libera el lock de Redis y borra el evento de Calendar si existe.
            Un pago tardio queda APROBADO y necesita decision manual, y `confirm`/`reschedule` rechazan una
            cita EXPIRADA. La franja liberada vuelve a aparecer en `/availability` porque el filtro de
            ocupacion es el mismo que usan la disponibilidad y las comprobaciones de solape.
          enum: [PENDIENTE_PAGO, CONFIRMADA, CANCELADA, COMPLETADA, NO_ASISTIO, EXPIRADA]
        serviceId: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        paymentUrl:
          type: [string, 'null']
          format: uri
          description: 'Deep-link de pago (Fase 2, pedido 5); hoy no existe en el backend'
