openapi: 3.1.0
info:
  title: saaspa-backend - Web Chat API (Frontend -> NestJS)
  version: 0.4.0
  description: >-
    Contrato IMPLEMENTADO v0.4.0. Reconciliado contra saaspa-backend@develop (9fc8b12) el 2026-09-26
    (informe: docs/contracts/f1-e2e-validation.md; la validacion del borrador esta en
    docs/contracts/t1.0-backend-validation.md). Implementado en src/modules/chat/chat.controller.ts
    y src/modules/chat/chat.service.ts (POST /api/chat, @Public(), 200).
    El frontend (widget anonimo, chat logueado y chat del dashboard) habla SIEMPRE con NestJS,
    nunca directamente con saaspa-IA. NestJS resuelve tenantId, canal, agente, rol e identidad, y
    emite el turn token antes de llamar a saaspa-IA (POST /api/v1/chat). El cliente NO envia tenant,
    canal, agente, rol ni identidad: solo mensaje y conversationId; el ValidationPipe global
    (whitelist + forbidNonWhitelisted) rechaza con 400 cualquier campo desconocido.
    Anti-abuso implementado: @Throttle de 20 req/60 s por IP; mensaje de mas de 1000 caracteres ->
    413; tope de 30 mensajes por hora por sesion anonima -> 429 (el contador vive en la base de datos,
    no en memoria); y el tope de coste del asistente (ADR 0010/0020 de saaspa-IA), que H-04 ya preserva
    como 429 real en vez de 502. Sin PII en logs (solo turnId, canal y conversacion).
    Sesion: la cookie kamerinos_chat_session (httpOnly, sameSite=lax, 7 dias, secure en produccion)
    identifica la sesion anonima; se guarda su hash SHA-256 y el conversationId es aleatorio de
    16 bytes en hex (32 caracteres) cuando el cliente no lo envia. Un conversationId que no pertenece
    a la sesion o al tenant responde 403.
    Handoff (A-10a): cuando la conversacion ya fue derivada, NestJS responde su texto canonico
    (HANDOFF_ACTIVE_MESSAGE) con handoff.requested=true SIN llamar a saaspa-IA, asi que el bot no
    puede retomar la conversacion.
    v0.3.0: el 429 incluye el tope de coste del asistente (scope tenant|conversation|origin, H-04 ya
    preserva ese 429) y el 504 cita el timeout real del backend (IA_BOT_TIMEOUT_MS = 25000 ms).
    v0.4.0 (J-07, verificado contra el codigo fusionado del backend: `ProblemDetailsFilter` y
    `problem-extensions.ts`): los errores de los endpoints de chat SI son RFC 9457
    (`application/problem+json` con `type` = `about:blank`, `title` por estado, `status`, `detail` e
    `instance`), con las extensiones del tope (`scope`/`measure`/`measured`/`limit`/`window`) solo en el
    429 de coste; se declaran 400/403/413/429/502/504 con ese media type. La propiedad `code` de
    saaspa-IA **no** se reenvia al widget: existe solo en el tramo IA -> backend (`chat-api`).
servers:
  - url: https://kamerinos.sandrapinzonsaludybelleza.com.co
paths:
  /api/chat:
    post:
      operationId: webChat
      summary: Procesa un turno del chat web (anonimo o logueado)
      description: >-
        Resuelve tenant, canal y agente en el servidor; si hay cookie de sesion valida, la identidad
        y el rol salen del token de sesion. Emite el turn token y reenvia el turno a saaspa-IA.
      security:
        - {}
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebChatRequest'
      responses:
        '200':
          description: Respuesta del agente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebChatResponse'
        '400':
          description: Cuerpo invalido (mensaje vacio, con formato incorrecto o campos desconocidos)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: >-
            El conversationId no pertenece a esta sesion (o a este tenant): la conversacion no se
            puede continuar desde otra sesion
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Mensaje demasiado largo (mas de 1000 caracteres; MAX_MESSAGE_LENGTH)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: >-
            Limite alcanzado: 20 peticiones por minuto y por IP (Throttler); tope de 30 mensajes por hora en
            la sesion anonima; o **tope de coste del asistente** (ADR 0010 y ADR 0020 de saaspa-IA: turnos o
            tokens por ventana, por tenant, por conversacion o por origen del turno, con `scope`
            tenant|conversation|origin y `measure` turns|tokens). El 429 del asistente se preserva tal cual
            hacia el widget (H-04): la clienta puede esperar y reintentar. Es el unico estado que puede traer
            las extensiones del tope.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: >-
            saaspa-IA devolvio un error no clasificado (el backend lo mapea a Bad Gateway) o no esta
            disponible
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: saaspa-IA no respondio dentro de IA_BOT_TIMEOUT_MS (25000 ms por defecto)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kamerinos_access_token
      description: >-
        Cookie httpOnly de sesion que ya emite el backend. Su ausencia (o caducidad) implica visitante
        anonimo, no un error.
  schemas:
    WebChatRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        conversationId:
          type: string
          maxLength: 64
          description: >-
            Identificador de la conversacion del widget. Ausente en el primer turno: NestJS lo genera
            (aleatorio de 128 bits, impredecible), lo ata a la sesion y lo devuelve en la respuesta.
        message:
          type: object
          required: [text]
          additionalProperties: false
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 1000
    WebChatResponse:
      type: object
      required: [conversationId, turnId, reply]
      properties:
        conversationId:
          type: string
          description: >-
            Identificador que el widget debe reenviar en los siguientes turnos. Si el cliente no lo
            envio, NestJS lo genera (16 bytes aleatorios en hex, 32 caracteres) y lo ata a la sesion.
        turnId:
          type: string
          format: uuid
        reply:
          type: object
          required: [text]
          properties:
            text: { type: string }
            links:
              type: array
              items:
                type: object
                required: [label, url]
                properties:
                  label: { type: string }
                  url: { type: string, format: uri }
        handoff:
          type: object
          description: >-
            Se OMITE cuando no hay handoff. Con handoff activo, `requested` es true y `reason` repite
            el motivo guardado (HEALTH_TOPIC, COMPLAINT o EXPLICIT_REQUEST).
          properties:
            requested: { type: boolean }
            reason: { type: string }
        usage:
          type: object
          required: [tokensIn, tokensOut]
          description: >-
            Siempre presente. Si saaspa-IA no informa los tokens, el backend los publica como 0
            (nunca null).
          properties:
            model: { type: string }
            tokensIn: { type: integer }
            tokensOut: { type: integer }
    Problem:
      type: object
      required: [type, title, status, detail]
      description: >-
        RFC 9457 (`application/problem+json`) para los endpoints de chat: son los unicos cuyo contrato declara
        ese formato (J-07). Lo produce el `ProblemDetailsFilter` del backend, que es `@Catch()`: cualquier
        error de estos endpoints sale asi, incluidos el 500 de un fallo inesperado (`detail` generico y la
        traza en los logs del backend, nunca en la respuesta) y el 501 si el agente pedido no existe todavia.
        El resto del API conserva la forma por defecto de NestJS (`{statusCode, message, error}`).
        `detail` es el texto que lee la clienta: el backend lo reenvia del `detail` de saaspa-IA (que sale de
        un catalogo cerrado, ADR 0017 de ese repo) o lo escribe el mismo. Las extensiones del tope de coste
        solo aparecen cuando el error es de ese tope (429).
        **La propiedad `code` de saaspa-IA NO viaja aqui**: existe solo en el tramo IA -> backend
        (`chat-api.openapi.yaml`) y este filtro copia unicamente las cinco extensiones documentadas.
      properties:
        type:
          type: string
          format: uri
          description: >-
            Hoy siempre `about:blank` (no hay registro de tipos): con ese valor, RFC 9457 dice que `title`
            describe el estado.
        title:
          type: string
          description: >-
            Frase corta por estado (no es el mensaje de la clienta, que va en `detail`): hoy 400 "Solicitud
            incorrecta", 403 "No autorizado", 413 "Contenido demasiado grande", 429 "Demasiadas solicitudes",
            502 "Pasarela incorrecta" y 504 "Tiempo de espera agotado".
        status: { type: integer }
        detail:
          type: string
          description: Texto especifico del error, apto para mostrarse a la clienta (catalogo de ADR 0017).
        instance:
          type: string
          format: uri
          description: Ruta de la peticion que fallo (por ejemplo `/api/chat`).
        scope:
          type: string
          enum: [tenant, conversation, origin]
          description: Extension del tope de coste (solo en el 429 de ese tope, ADR 0010 y ADR 0020).
        measure:
          type: string
          enum: [turns, tokens]
          description: Extension del tope de coste (solo en el 429 de ese tope).
        measured:
          type: integer
          description: Consumo medido en la ventana, en la medida de `measure` (solo en el 429 del tope).
        limit:
          type: integer
          description: Limite configurado que se alcanzo (solo en el 429 del tope).
        window:
          type: string
          description: Ventana del tope en duracion ISO-8601, por ejemplo `PT1H` (solo en el 429 del tope).
