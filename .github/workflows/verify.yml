name: verify

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'docs/**', 'chore/**']
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: ./mvnw -B verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw -B verify

  image:
    name: docker build
    runs-on: ubuntu-latest

    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Solo se valida que la imagen se construye: es lo que kamerinos-infra
      # hace en el despliegue (`docker compose build` de `ia-bot`). El arranque
      # contra PostgreSQL real se valida a mano (necesita un Postgres de
      # servicio y el mapeo de red del contenedor).
      - name: Build the ia-bot image
        run: docker build -t saaspa-ia:ci .
