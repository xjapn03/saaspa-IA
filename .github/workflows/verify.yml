name: verify

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'docs/**', 'chore/**']
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: ./mvnw -B verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw -B verify
