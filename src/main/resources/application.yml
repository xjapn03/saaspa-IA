spring:
  application:
    name: saaspa-ia
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      # El esquema propio del servicio es `ia`; el repo de memoria consulta sin calificar.
      connection-init-sql: SET search_path TO ia, public
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ia
    default-schema: ia
    create-schemas: true
  ai:
    deepseek:
      api-key: ${LLM_API_KEY:}
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-flash}
          temperature: 0.3
          max-tokens: 1024
    chat:
      memory:
        repository:
          jdbc:
            # La tabla la crea Flyway V1 (nunca la inicializa Spring AI).
            initialize-schema: never

server:
  port: ${PORT:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

saaspa:
  tenant:
    default: ${IA_TENANT_DEFAULT:kamerinos}
    # Nombre visible del negocio en los prompts.
    display-name: ${IA_TENANT_DISPLAY_NAME:Kamerinos SPA Bogota}
    # Zona horaria del negocio: fechas relativas y horas de agenda (R13).
    timezone: ${IA_TENANT_TIMEZONE:America/Bogota}
  agent:
    # Ventana de memoria: mensajes que se envian al modelo (D-MEM).
    memory-window: ${IA_AGENT_MEMORY_WINDOW:10}
    # Prompt de sistema versionado del agente CLIENTAS (es-CO).
    customer-prompt: classpath:prompts/customer-agent.v1.md
  backend:
    base-url: ${BACKEND_URL:http://localhost:3001}
    internal-api-key: ${INTERNAL_API_KEY:}
    # Timeouts explicitos del cliente HTTP hacia NestJS (AGENTS.md, seccion 8).
    connect-timeout: ${BACKEND_CONNECT_TIMEOUT:1s}
    read-timeout: ${BACKEND_READ_TIMEOUT:5s}
  chat-api:
    # Clave de servicio en la direccion NestJS -> IA (IA_BOT_API_KEY; distinta de INTERNAL_API_KEY).
    service-key: ${IA_BOT_API_KEY:}
  turn-token:
    # Verificacion asimetrica ES256 (P-256): solo claves publicas, seleccionadas por kid (ADR 0006).
    # Dos ranuras para rotar sin cortar el servicio (current firma; previous sigue aceptada).
    audience: ${TURN_TOKEN_AUDIENCE:saaspa-ia}
    issuer: ${TURN_TOKEN_ISSUER:}
    keys:
      - kid: ${TURN_TOKEN_KEY_CURRENT_KID:}
        public-key: ${TURN_TOKEN_KEY_CURRENT_PUBLIC_KEY:}
      - kid: ${TURN_TOKEN_KEY_PREVIOUS_KID:}
        public-key: ${TURN_TOKEN_KEY_PREVIOUS_PUBLIC_KEY:}
