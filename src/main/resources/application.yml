spring:
  application:
    name: saaspa-ia
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      # El esquema propio del servicio es `ia`; el repo de memoria consulta sin calificar.
      connection-init-sql: SET search_path TO ia, public
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ia
    default-schema: ia
    create-schemas: true
  ai:
    deepseek:
      api-key: ${LLM_API_KEY:}
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-flash}
          temperature: 0.3
          max-tokens: 1024
    chat:
      memory:
        repository:
          jdbc:
            # La tabla la crea Flyway V1 (nunca la inicializa Spring AI).
            initialize-schema: never

server:
  port: ${PORT:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

saaspa:
  tenant:
    default: ${IA_TENANT_DEFAULT:kamerinos}
  backend:
    base-url: ${BACKEND_URL:http://localhost:3001}
    internal-api-key: ${INTERNAL_API_KEY:}
  turn-token:
    # Verificacion asimetrica: el servicio solo recibe la clave publica (ADR 0006).
    public-key: ${TURN_TOKEN_PUBLIC_KEY:}
