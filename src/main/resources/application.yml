spring:
  application:
    name: saaspa-ia
  threads:
    virtual:
      enabled: true
  datasource:
    # Credenciales del esquema propio `ia`. Se declaran aqui (y no solo en el perfil `local`) porque el
    # despliegue inyecta DATABASE_URL/DATABASE_USER/DATABASE_PASSWORD: sin esta traduccion el contenedor
    # no arranca (`Failed to configure a DataSource`), porque Spring Boot no lee esos nombres por si solo.
    # Si falta la variable en produccion el arranque falla cerrado: conexion rechazada, no un fallback mudo.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/saaspa_ia}
    username: ${DATABASE_USER:saaspa}
    password: ${DATABASE_PASSWORD:saaspa}
    hikari:
      # El esquema propio del servicio es `ia`; el repo de memoria consulta sin calificar.
      connection-init-sql: SET search_path TO ia, public
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ia
    default-schema: ia
    create-schemas: true
  ai:
    deepseek:
      api-key: ${LLM_API_KEY:}
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-flash}
          temperature: 0.3
          max-tokens: 1024
    retry:
      # Reintentos acotados de la llamada al modelo (ADR 0009): 2 reintentos y backoff corto.
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
      # 408 (timeout) y 429 (rate limit) son transitorios: SÍ se reintentan.
      on-http-codes: 408,429
      # El resto de 4xx son errores del cliente, no transitorios: no se reintentan.
      exclude-on-http-codes: 400,401,403,404,409,422
    chat:
      memory:
        repository:
          jdbc:
            # La tabla la crea Flyway V1 (nunca la inicializa Spring AI).
            initialize-schema: never

server:
  port: ${PORT:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

saaspa:
  tenant:
    default: ${IA_TENANT_DEFAULT:kamerinos}
    # Nombre visible del negocio en los prompts.
    display-name: ${IA_TENANT_DISPLAY_NAME:Kamerinos SPA Bogota}
    # Zona horaria del negocio: fechas relativas y horas de agenda (R13).
    timezone: ${IA_TENANT_TIMEZONE:America/Bogota}
  agent:
    # Ventana de memoria: mensajes que se envian al modelo (D-MEM).
    memory-window: ${IA_AGENT_MEMORY_WINDOW:10}
    # Prompt de sistema versionado del agente CLIENTAS (es-CO).
    customer-prompt: classpath:prompts/customer-agent.v2.md
  # Tope de coste por tenant y por conversacion (ADR 0010). Fuente de verdad: `ia.turn_log` (tokens y
  # latencia por turno), sin contador en memoria: un reinicio no borra el consumo acumulado.
  cost-guard:
    # Permite apagarlo sin desplegar codigo nuevo.
    enabled: ${IA_COST_GUARD_ENABLED:true}
    # Ventana movil de los topes; se alinea con la del backend (30 mensajes por hora y por sesion anonima).
    window: ${IA_COST_GUARD_WINDOW:1h}
    # Por tenant: 240 turnos/hora = 4 por minuto sostenidos. El backend ya limita a 20 req/min por IP y a
    # 30 mensajes/hora por sesion anonima, asi que este tope solo salta con muchas clientas a la vez o con
    # un bucle o abuso; es el primero de los cuatro topes que acota el coste de un tenant entero.
    tenant-max-turns: ${IA_COST_GUARD_TENANT_MAX_TURNS:240}
    # 1.000.000 tokens/hora por tenant: el turno medido en el E2E de la Fase 1 gasto ~4.000 tokens
    # (3.750 de entrada + 317 de salida), asi que 240 turnos caben justo por debajo.
    tenant-max-tokens: ${IA_COST_GUARD_TENANT_MAX_TOKENS:1000000}
    # Por conversacion: 30 turnos/hora, el mismo numero que el tope de sesion anonima del backend
    # (ANONYMOUS_MESSAGE_CAP), para no cortar antes que el gateway.
    conversation-max-turns: ${IA_COST_GUARD_CONVERSATION_MAX_TURNS:30}
    # 150.000 tokens/hora por conversacion: 30 turnos x ~4.000 tokens = 120.000, con holgura por si crecen
    # el prompt o la memoria.
    conversation-max-tokens: ${IA_COST_GUARD_CONVERSATION_MAX_TOKENS:150000}
    # Por ORIGEN del turno (ADR 0020 / H-04): 60 turnos/hora. Es el tope que corta a un abuso desde una sola
    # IP, que antes podia quemar los 240 del tenant en ~12 minutos y dejar fuera a todas las clientas. Con
    # 60, una IP consume como maximo un cuarto del presupuesto del tenant; el tope del tenant queda como
    # senal de capacidad. La clave de origen es el usuario si el turno esta identificado y la IP resuelta por
    # el backend si es anonimo: ese claim (`clientIp`) ya lo emite saaspa-backend (su PR #84), asi que el canal
    # anonimo esta cubierto; evidencia en docs/contracts/h04-origin-claim-validation.md. Ni el usuario ni la IP
    # se pueden rotar.
    origin-max-turns: ${IA_COST_GUARD_ORIGIN_MAX_TURNS:60}
    # Sal del hash con el que se guarda el origen en `ia.turn_log` (nunca la IP en claro). OBLIGATORIA en
    # produccion: sin ella el tope por origen funciona igual, pero el hash de una IP se puede revertir por
    # fuerza bruta desde la tabla (se avisa al arrancar).
    origin-salt: ${IA_COST_GUARD_ORIGIN_SALT:}
  llm:
    # Timeouts del cliente HTTP hacia el modelo (ADR 0009). Aparte del cliente del backend.
    connect-timeout: ${LLM_CONNECT_TIMEOUT:3s}
    read-timeout: ${LLM_READ_TIMEOUT:10s}
    # Tope total del turno conversacional (llamada al modelo + herramientas).
    # Escalera end-to-end (ADR 0014): read-timeout (10s) < turn-deadline (20s) < IA_BOT_TIMEOUT_MS
    # del backend (25s). El deadline NUNCA debe superar el timeout con el que NestJS llama a este
    # servicio: si lo supera, el backend corta antes y quedan turnos huerfanos gastando tokens.
    turn-deadline: ${LLM_TURN_DEADLINE:20s}
  backend:
    base-url: ${BACKEND_URL:http://localhost:3001}
    internal-api-key: ${INTERNAL_API_KEY:}
    # Timeouts explicitos del cliente HTTP hacia NestJS (AGENTS.md, seccion 8).
    connect-timeout: ${BACKEND_CONNECT_TIMEOUT:1s}
    read-timeout: ${BACKEND_READ_TIMEOUT:5s}
  chat-api:
    # Clave de servicio en la direccion NestJS -> IA (IA_BOT_API_KEY; distinta de INTERNAL_API_KEY).
    service-key: ${IA_BOT_API_KEY:}
  turn-token:
    # Verificacion asimetrica ES256 (P-256): solo claves publicas, seleccionadas por kid (ADR 0006).
    # Dos ranuras para rotar sin cortar el servicio (current firma; previous sigue aceptada).
    audience: ${TURN_TOKEN_AUDIENCE:saaspa-ia}
    issuer: ${TURN_TOKEN_ISSUER:}
    keys:
      - kid: ${TURN_TOKEN_KEY_CURRENT_KID:}
        public-key: ${TURN_TOKEN_KEY_CURRENT_PUBLIC_KEY:}
      - kid: ${TURN_TOKEN_KEY_PREVIOUS_KID:}
        public-key: ${TURN_TOKEN_KEY_PREVIOUS_PUBLIC_KEY:}
