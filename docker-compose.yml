name: saaspa-ia

# Infraestructura SOLO para desarrollo local.
# Produccion vive en kamerinos-infra (contenedor `ia-bot`).
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: saaspa_ia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-saaspa}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-saaspa}
      POSTGRES_DB: ${POSTGRES_DB:-saaspa_ia}
    ports:
      - "5433:5432"
    volumes:
      - ia_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-saaspa}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ia_pg_data:
